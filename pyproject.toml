[project]
name = "stock-market-learning"
version = "0.1.0"
description = "Beginner-friendly, notebook-driven tour of stock-market analysis: prices, charts, indicators, fundamentals, news sentiment, and document reading."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yfinance>=0.2.60",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mplfinance>=0.12",
    "vaderSentiment>=3.3",
    "feedparser>=6.0",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pyarrow>=16",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "rich>=13.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stocklearn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
